services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Gateway: Data Source=/data/gateway.db
    volumes:
      - gateway-data:/data
    ports:
      - "8080:8080"

  mcp:
    build:
      context: .
      dockerfile: infra/docker/mcp.Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Gateway: Data Source=/data/gateway.db
    volumes:
      - gateway-data:/data
    ports:
      - "8081:8080"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - api

volumes:
  gateway-data:
